[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourthdown"
version = "0.1.0"
description = "A counterfactual expected-points and win-probability model for NFL fourth-down decisions"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy",
    "polars",
    "pandas",
    "pyarrow",
    "torch",
    "xgboost",
    "scikit-learn",
    "flask",
    "flask-cors",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
